<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Marte - 2 Lunas</title>
    <link rel="stylesheet" href="marte.css">
</head>
<body>

    <main class="espacio-planeta">

        <header class="encabezado">
            <a href="planetas.html" class="volver">← Volver a los planetas</a>
            <h1>El Planeta Rojo: Marte</h1>
            <p>Mundo rocoso rico en óxido de hierro con colosales volcanes y 2 satélites naturales</p>
        </header>

        <div class="contenedor-principal">

            <!-- VISOR ESPACIAL CENTRAL -->
            <section class="lienzo-orbital">

                <!-- Planeta Central Levitante (Marte) -->
                <div class="planeta-contenedor levitar-planeta">
                    <div class="planeta-gigante marte"></div>
                </div>

                <!-- ANILLO / ÓRBITA CON LAS LUNAS -->
                <div class="sistema-orbital">
                    <div class="luna-nodo o-1 a-45 principal desfas-1">
                        <span class="punto"></span>
                        <span class="nombre">Fobos</span>
                    </div>
                    <div class="luna-nodo o-1 a-225 principal desfas-3">
                        <span class="punto"></span>
                        <span class="nombre">Deimos</span>
                    </div>
                </div>

            </section>

            <aside class="panel-info">
                <div class="tarjeta-maravilla"><h2>🔴 Colosos y Cañones</h2>
                    <p>Alberga el Monte Olimpo (el volcán más grande del sistema solar) y el imponente sistema de cañones Valles Marineris.</p>
                </div>
            </aside>

        </div>

    </main>

</body>
</html>
