<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de la Tierra - 1 Luna</title>
    <link rel="stylesheet" href="tierra.css">
</head>
<body>

    <main class="espacio-planeta">

        <header class="encabezado">
            <a href="planetas.html" class="volver">← Volver a los planetas</a>
            <h1>El Planeta Azul: Tierra</h1>
            <p>Nuestro hogar en el cosmos, con atmósfera de oxígeno-nitrógeno y 1 satélite natural</p>
        </header>

        <div class="contenedor-principal">

            <!-- VISOR ESPACIAL CENTRAL -->
            <section class="lienzo-orbital">

                <!-- Planeta Central Levitante (Tierra con atmósfera y continentes) -->
                <div class="planeta-contenedor levitar-planeta">
                    <div class="capa-atmosfera tierra-halo"></div>
                    <div class="planeta-gigante tierra">
                        <div class="continente tc1"></div>
                        <div class="continente tc2"></div>
                        <div class="continente tc3"></div>
                    </div>
                </div>

                <!-- ANILLO / ÓRBITA CON LA LUNA -->
                <div class="sistema-orbital">
                    <div class="luna-nodo o-1 a-90 principal desfas-1">
                        <span class="punto"></span>
                        <span class="nombre">La Luna</span>
                    </div>
                </div>

            </section>

            <aside class="panel-info">
                <div class="tarjeta-maravilla">
                    <h2>🌍 Oasis de Vida</h2>
                    <p>Único mundo conocido con agua líquida superficial, tectónica de placas activa y una atmósfera protectora rica en nitrógeno y oxígeno.</p>
                </div>
            </aside>

        </div>

    </main>

</body>
</html>
